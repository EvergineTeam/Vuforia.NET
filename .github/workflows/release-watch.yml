name: Release watch

# Notices that Vuforia has published a newer SDK and opens an issue about it.
#
# It exists because there is nothing to subscribe to. The GitHub tracker
# PTCInc/vuforia-engine stopped publishing at 11.3.4 in June 2025, which is older than the
# 11.4.4 this repository already wraps; the Unity npm registry stopped at 9.6.3 in 2020;
# Maven and CocoaPods carry only third-party artifacts; the downloads page needs a sign-in;
# and there is no feed. The reasoning behind every one of those is in
# build/scripts/check-upstream-release.py.
#
# Report and stop, deliberately. The SDK is only downloadable after accepting the EULA, so
# refreshing VuforiaGen/Headers is a licensing decision a person makes. What is automated is
# everything after it: committing the refreshed headers to main triggers CD, which
# regenerates, commits and publishes.
#
# Monthly. Vuforia shipped roughly every six weeks through the first half of 2025 and
# nothing since 11.4.4, so a weekly run is noise on a signal that moves this slowly.
#
# A failed run here is the point, not an annoyance: the scrape asserts that it read at least
# twenty versions and that the recorded one is among them, so red means "the check can no
# longer be trusted" rather than "no news". Note that ci-doctor will not pick it up -- it
# only watches workflows named CI, CD and Sync standards -- so the red run in the Actions
# tab and the scheduled-failure notification are the whole alarm.

on:
  schedule:
    - cron: '0 4 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for a newer SDK
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/scripts/check-upstream-release.py

      - name: Open an issue
        if: steps.check.outputs.newer != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWER: ${{ steps.check.outputs.newer }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Vuforia Engine SDK ${NEWER} is available"

          # Deduplicated by exact title rather than by label, so a version left unadopted
          # for months produces one issue and not one per run. A different version gets a
          # different title and therefore its own issue, which is right -- skipping a
          # release should be a visible decision rather than an edit to an old thread.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
               --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "Already open: $TITLE"
            exit 0
          fi

          # The body is written by the check step. A heredoc here would carry this block's
          # indentation into every line and GitHub would render the lot as a code block.
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md