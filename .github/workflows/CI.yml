# Builds the generator, regenerates the bindings from the vendored headers, and builds the
# package.
#
# The name stays `CI`, for the same reason `CD` does: ci-doctor only reacts to workflows
# named exactly `CI`, `CD` or `Sync standards`.
name: CI

on:
  workflow_dispatch:
    inputs:
      publish-artifacts:
        description: 'Publish artifacts'
        required: false
        type: boolean
        default: false
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    # Moved off evergine-standards@v2 and onto the toolbox, which is where the rest of the
    # fleet's CI lives. Two reasons beyond consistency: the toolbox updater keeps installed
    # workflows current, and `evergine-standards` has an unresolved v2-versus-main question
    # that this repository no longer needs to have an opinion about.
    uses: EvergineTeam/Evergine.Bindings/.github/workflows/binding-common-ci.yml@v1
    with:
      generator-project: "VuforiaGen/VuforiaGen.csproj"
      generator-name: "VuforiaGen"
      binding-project: "Evergine.Bindings.Vuforia/Evergine.Bindings.Vuforia.csproj"
      target-framework: "net10.0"
      dotnet-version: "10.x"
      # Windows, because CppAst's libclang cannot resolve <stdint.h> on the macOS runner:
      # Core/Basic.h(18) fails and the Android compilation aborts. That was invisible until
      # a failed parse became fatal, since the old code printed the errors and generated
      # from the partial result -- into a directory nobody read, so two faults were hiding
      # each other. The binding targets net10.0-ios, but it is a class library rather than
      # an app, so the iOS workload builds it on Windows without a Mac.
      runtime-identifier: "win-x64"
      runner-os: "windows-latest"
      restore-workloads: true
      build-configuration: "Release"
      nuget-artifacts: ${{ inputs.publish-artifacts || false }}
      revision: ${{ github.run_number }}
